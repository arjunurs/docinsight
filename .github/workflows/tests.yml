name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.0"
          enable-cache: true
      # Python version comes from .python-version, the same as the Docker image
      - run: uv sync --locked
      # Offline: embeddings and LLMs are mocked, so no API key is needed
      - run: uv run --locked pytest -q tests
