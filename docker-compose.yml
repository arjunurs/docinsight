version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # EXTRAS=rerank docker-compose up -d --build adds the optional reranker
        EXTRAS: ${EXTRAS:-}
    container_name: docinsight
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped 